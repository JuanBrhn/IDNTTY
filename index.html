<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDNTTY</title>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.5s ease, color 0.5s ease;
    }
    body.dark  { background: #0a0a0a; color: #f0f0f0; }
    body.light { background: #ffffff; color: #0a0a0a; }
    body.red   { background: #c0000a; color: #ffffff; }
    body.blank { background: #ffffff; }

    .page {
      min-height: 100vh;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      text-align: center;
      animation: entrada 0.5s ease;
    }
    @keyframes entrada {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes golpe {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .golpe { animation: golpe 0.35s ease; }

    .app-title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }
    .claim {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.35;
      margin-bottom: 3rem;
      letter-spacing: -0.01em;
    }
    .contador {
      font-size: 13px;
      letter-spacing: 0.08em;
      opacity: 0.35;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }
    .contador span { opacity: 1; font-weight: 500; }
    .texto {
      font-size: 16px;
      line-height: 1.85;
      max-width: 320px;
      margin-bottom: 2rem;
      opacity: 0.85;
    }
    .texto.grande {
      font-size: 19px;
      font-weight: 400;
      opacity: 1;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }
    .texto ol {
      text-align: left;
      padding-left: 1.25rem;
      margin-top: 1rem;
    }
    .texto ol li { margin-bottom: 0.6rem; }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }
    .btn {
      padding: 1rem 1.5rem;
      font-size: 16px;
      font-weight: 400;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); }
    body.dark .btn {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #f0f0f0;
    }
    body.dark .btn:hover { background: rgba(255,255,255,0.1); }
    body.dark .btn.principal {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.09);
      color: #fff;
    }
    body.dark .btn.principal:hover { background: rgba(255,255,255,0.15); }
    body.light .btn {
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.04);
      color: #0a0a0a;
    }
    body.light .btn:hover { background: rgba(0,0,0,0.08); }
    body.light .btn.principal {
      border-color: rgba(0,0,0,0.3);
      background: rgba(0,0,0,0.07);
      color: #0a0a0a;
    }
    body.light .btn.principal:hover { background: rgba(0,0,0,0.12); }
    body.dark .btn.secundario {
      border-color: rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
    }
    body.light .btn.secundario {
      border-color: rgba(0,0,0,0.08);
      background: transparent;
      color: rgba(0,0,0,0.35);
      font-size: 14px;
    }
    .separador {
      width: 24px; height: 1px;
      margin: 0 auto 2rem;
    }
    body.dark .separador  { background: rgba(255,255,255,0.15); }
    body.light .separador { background: rgba(0,0,0,0.15); }
    .pregunta-loop {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .input-area {
      width: 100%;
      max-width: 300px;
      margin-bottom: 1.25rem;
    }
    .input-area textarea {
      width: 100%;
      min-height: 100px;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(0,0,0,0.03);
      color: #0a0a0a;
      outline: none;
    }
  </style>
</head>
<body class="dark">
<div id="app"></div>
<script>
  var enEscenario = false;
  var noCount = 0;

  function sonar() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  function vibrar() {
    if ('vibrate' in navigator) navigator.vibrate([400, 100, 400, 100, 800]);
  }

  var pusher = new Pusher('3f2e85fafca817cc9e2c', { cluster: 'eu' });
  var canal = pusher.subscribe('idntty');

  canal.bind('pantalla', function(data) {
    if (!data || !data.id) return;
    var id = data.id;

    // Pantallas que solo afectan a quien está en escenario
    var soloEscenario = ['p-terminos','p1','p2','p3','p4','p5','p6','p7','p8','p9',
      'p10','p11','p12','p13','p14','p15','p16','p16b','p17','p18','p19',
      'p20','p21','p22','p23','p24','p25','p26'];

    if (soloEscenario.indexOf(id) !== -1 && !enEscenario) return;

    if (id === 'p-terminos') vibrar();
    sonar();
    render(id);
  });

  canal.bind('contador', function(data) {
    var el = document.getElementById('contador-num');
    if (el && data && data.total !== undefined) el.textContent = data.total;
  });

  fetch('/api/contador', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({accion:'entrar'}) }).catch(function(){});
  window.addEventListener('beforeunload', function() {
    navigator.sendBeacon('/api/contador', JSON.stringify({accion:'salir'}));
  });

  function render(id) {
    var app = document.getElementById('app');
    var body = document.body;

    // ESPERA INICIAL — arranca aquí siempre
    if (id === 'espera') {
      enEscenario = false;
      body.className = 'dark';
      app.innerHTML = '<div class="page"></div>';

    // PANTALLA CERO
    } else if (id === 'p-cero') {
      enEscenario = false;
      body.className = 'dark';
      app.innerHTML = `
        <div class="page golpe">
          <p class="app-title">IDNTTY</p>
          <div class="texto">
            ¡Has escaneado el código a la perfección!<br><br>
            Mantente a la espera con la pantalla desbloqueada en todo momento.
          </div>
        </div>`;

    // INICIO
    } else if (id === 'inicio') {
      enEscenario = false; noCount = 0;
      body.className = 'dark';
      app.innerHTML = `
        <div class="page golpe">
          <p class="contador">Conectados: <span id="contador-num">—</span></p>
          <p class="claim">¿Quieres vivir la experiencia?</p>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p-si')">Sí</button>
            <button class="btn" onclick="renderNo()">No</button>
          </div>
        </div>`;
      fetch('/api/contador', { method: 'GET' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          var el = document.getElementById('contador-num');
          if (el && d.total !== undefined) el.textContent = d.total;
        }).catch(function(){});

    // SÍ
    } else if (id === 'p-si') {
      enEscenario = true; noCount = 0;
      body.className = 'dark';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto">
            <span style="display:block;font-size:20px;font-weight:400;margin-bottom:1.5rem;">Bienvenido/a.<br>Es un honor que formes parte de esto.</span>
            Tu lugar está en el escenario. Deja las cosas en la grada, baja y ocupa una de las marcas verdes que hay en el suelo.
            <ol>
              <li>Deja todas tus cosas en tu asiento y solo llévate tu móvil.</li>
              <li>Pon el volumen multimedia y de las notificaciones en sonido, ya que te enviaremos avisos sonoros.</li>
              <li>Podrás moverte solo encima de la marca, puedes girarte, mirar a donde quieras, pero solo desde la marca, a no ser que la plataforma te pida lo contrario.</li>
            </ol>
            <br>Pronto podrás disfrutar de la increíble Experiencia.
          </div>
        </div>`;

    // TÉRMINOS
    } else if (id === 'p-terminos') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <p class="claim">¿Acepta los términos y condiciones del servicio?</p>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p-acepto')">Acepto</button>
            <button class="btn" onclick="render('p-no-acepto')">No acepto</button>
          </div>
        </div>`;

    } else if (id === 'p-acepto') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto">
            Acaba de aceptar los términos y condiciones de vida. Acaba de dejar sus manos en algo invisible, algo que no ve, que no siente, que no está. Esto ya lo hizo hace tiempo. Por eso estamos aquí. Mirando todos una pantalla del móvil.<br><br>
            <strong>¡Bienvenido a IDNTTY!</strong>
          </div>
        </div>`;

    } else if (id === 'p-no-acepto') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto">
            No hay opción correcta, no se puede no aceptar. Ya aceptó hace tiempo. Por eso estamos aquí. Mirando todos una pantalla del móvil.<br><br>
            <strong>¡Bienvenido a IDNTTY!</strong>
          </div>
        </div>`;

    // PRUEBAS
    } else if (id === 'p1') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡BIENVENIDO A IDNTTY!<br><br>Te hemos clasificado en una de las 5 personalidades. Tu pulsera muestra el grupo de personalidad al que perteneces.<br><br>IDNTTY tiene varios planes de suscripción. Para llegar a la experiencia deberás tener la categoría MY IDNTTY PLUS TOTALLY GOLD<br><br>EMPECEMOS CON LA CONFIGURACIÓN DE TU PERFIL</div></div>`;

    } else if (id === 'p2') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Por favor, diga su nombre en voz alta para iniciar sesión en el sistema.</div></div>`;

    } else if (id === 'p3') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Ahora, diga un poco más alto el color de su pulsera.</div></div>`;

    } else if (id === 'p4') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡Gracias! Ya lo hemos registrado.<br><br>Pronto podrás vivir la experiencia.</div></div>`;

    } else if (id === 'p5') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Ahora vayamos a registrar otros datos biométricos. Es el turno de nuestros asistentes físicos.<br><br><span style="opacity:0.5;font-size:14px;">Por favor, no bloqueen ni refresquen esta pantalla.</span></div></div>`;

    } else if (id === 'p6') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡Gracias! Ya lo hemos registrado.</div></div>`;

    } else if (id === 'p7') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Ahora vayamos a registrar otros datos sociales. Es el turno de nuestros asistentes físicos.<br><br><span style="opacity:0.5;font-size:14px;">Por favor, no bloqueen ni refresquen esta pantalla.</span></div></div>`;

    } else if (id === 'p8') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡Vaya! Tienes 94 amigos nuevos ¡Estás que te sales! Eres el más popular de la sala.</div></div>`;

    } else if (id === 'p9') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto grande" style="margin-bottom:2rem;">¡Oh! Parece ser que has llegado al límite de acciones con tu cuenta.<br><br>¿Quieres acceder al siguiente nivel de suscripción para no perderte nada?</div>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p10')">Acceder al siguiente nivel de suscripción</button>
            <button class="btn secundario" onclick="render('p9-abandonar')">Abandonar la experiencia</button>
          </div>
        </div>`;

    } else if (id === 'p9-abandonar') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto" style="margin-bottom:2rem;">Estás a punto de abandonar y no disfrutar de la gran experiencia que hay al final del recorrido.<br><br>¿Quieres abandonar?</div>
          <div class="btn-group">
            <button class="btn secundario" onclick="abandonFinal()">Sí, quiero perderme la experiencia</button>
            <button class="btn principal" onclick="render('p10')">Quiero seguir en la experiencia</button>
          </div>
        </div>`;

    } else if (id === 'p10') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡Perfecto! Para acceder al siguiente nivel necesitamos que contestes a la siguiente pregunta en voz alta.<br><br>¿Has tenido alguna vez mascota? Si es así di su nombre en voz alta. Si no has tenido, haz el sonido del animal que te hubiera gustado tener como mascota.</div></div>`;

    } else if (id === 'p11') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">¡Gracias! Ya lo hemos registrado. Bienvenido al nivel MY IDNTTY PREMIUM</div></div>`;

    } else if (id === 'p12') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Ahora vayamos a registrar otros datos sobre su pasado. Es el turno de nuestros asistentes físicos.<br><br><span style="opacity:0.5;font-size:14px;">Por favor, no bloqueen ni refresquen esta pantalla.</span></div></div>`;

    } else if (id === 'p13') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto grande" style="margin-bottom:1.5rem;">Escríbalo aquí</div>
          <div class="input-area"><textarea placeholder=""></textarea></div>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p14')">Enviar</button>
          </div>
        </div>`;

    } else if (id === 'p14') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Mmmm ¡Que rico! ¡Gracias! Estás más cerca de disfrutar de la experiencia.</div></div>`;

    } else if (id === 'p15') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto grande" style="margin-bottom:2rem;">¡Vaya! Parece ser que has llegado al límite de acciones con tu cuenta.<br><br>¿Quieres acceder al siguiente nivel de suscripción para no perderte nada?</div>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p16')">Acceder al siguiente nivel de suscripción</button>
            <button class="btn secundario" onclick="render('p15-abandonar')">Abandonar la experiencia</button>
          </div>
        </div>`;

    } else if (id === 'p15-abandonar') {
      body.className = 'light';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto" style="margin-bottom:2rem;">Estás a punto de abandonar y no disfrutar de la gran experiencia que hay al final del recorrido.<br><br>¿Quieres abandonar?</div>
          <div class="btn-group">
            <button class="btn secundario" onclick="abandonFinal()">Sí, quiero perderme la experiencia</button>
            <button class="btn principal" onclick="render('p16')">Quiero seguir en la experiencia</button>
          </div>
        </div>`;

    } else if (id === 'p-abandon-final') {
      enEscenario = false;
      body.className = 'dark';
      app.innerHTML = `
        <div class="page golpe">
          <div class="texto">
            ¡Vaya! Vemos que no has querido sucumbir a la tentación de pasártelo bien en IDNTTY. No te preocupes, también hay hueco para ti.<br><br>
            Vuelve a la grada. Te invitamos a que disfrutes desde ahí.<br><br>
            Hasta aquí ha llegado tu experiencia.
          </div>
        </div>`;

    } else if (id === 'p16') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Es el turno de nuestros asistentes físicos.<br><br><span style="opacity:0.5;font-size:14px;">Por favor, no bloqueen ni refresquen esta pantalla.</span></div></div>`;

    } else if (id === 'p16b') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande" style="text-align:left;">¿Has deseado la muerte de alguien? ¿Has mirado con deseo a alguien de los aquí presentes? ¿Querrías estar en otro lugar? ¿Cuántas veces has pensado en el suicidio? ¿Hace cuánto que no vas a ver a tus padres? ¿Y a tus hijos? ¿Te consideras buena persona? ¿Quieres cambiar algo de tu vida?<br><br><span style="font-size:14px;opacity:0.6;">No respondas en voz alta. El sistema registrará las respuestas a través de las ondas cerebrales. Hemos oído todo lo que has pensado.</span></div></div>`;

    } else if (id === 'p17') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Ya lo hemos registrado.</div></div>`;

    } else if (id === 'p18') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Reconfigurando su perfil.</div></div>`;

    } else if (id === 'p19') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">La plataforma necesita una última cosa para completar la suscripción a MY IDNTTY PLUS TOTALLY GOLD y poder vivir la maravillosa experiencia.</div></div>`;

    } else if (id === 'p20') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Tienes que eliminar varios contactos de tu red de amistad. Hemos detectado incompatibilidad con 3 de tus contactos.<br><br>Elige a una persona de un color diferente al tuyo y acaba con su vida.</div></div>`;

    } else if (id === 'p21') {
      body.className = 'red';
      app.innerHTML = `<div class="page golpe"><div class="texto grande" style="color:#fff;">ERROR EN EL SISTEMA.<br>RECALIBRANDO LA PLATAFORMA.</div></div>`;

    } else if (id === 'p22') {
      body.className = 'dark';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Cierre de sesión inesperado.</div></div>`;

    } else if (id === 'p23') {
      body.className = 'blank';
      app.innerHTML = `<div class="page golpe"></div>`;

    } else if (id === 'p24') {
      body.className = 'light';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">NO BAILÉIS.<br>NADIE OS HA PERMITIDO BAILAR.</div></div>`;

    } else if (id === 'p25') {
      body.className = 'dark';
      app.innerHTML = `<div class="page golpe"><div class="texto grande">Desconectándote de IDNTTY.<br>Dejarás de pertenecer.</div></div>`;

    } else if (id === 'p26') {
      body.className = 'dark';
      app.innerHTML = `<div class="page golpe"></div>`;
    }
  }

  function abandonFinal() {
    enEscenario = false;
    render('p-abandon-final');
  }

  function renderNo() {
    noCount++;
    enEscenario = false;
    document.body.className = 'dark';
    var app = document.getElementById('app');
    if (noCount >= 4) {
      app.innerHTML = `
        <div class="page">
          <div class="texto">
            ¡Vaya! Vemos que no has querido sucumbir a la tentación de pasártelo bien en IDNTTY. No te preocupes, también hay hueco para ti.<br><br>
            Quédate en la grada. Te invitamos a que disfrutes desde ahí.<br><br>
            Hasta aquí ha llegado tu experiencia.
          </div>
        </div>`;
    } else {
      app.innerHTML = `
        <div class="page">
          <div class="texto">
            Nos encantaría que hubieras pulsado Sí, pero en cualquier caso, estamos encantados de recibirte. Ya que no nos has dado tu confirmación, te tenemos que pedir que te quedes en tu sitio. Ya que esta experiencia es solo para personas valientes.<br><br>
            Pero como creemos en las segundas oportunidades, te lo volvemos a preguntar:
          </div>
          <div class="separador"></div>
          <p class="pregunta-loop">¿Quieres vivir la experiencia?</p>
          <div class="btn-group">
            <button class="btn principal" onclick="render('p-si')">Sí</button>
            <button class="btn" onclick="renderNo()">No</button>
          </div>
        </div>`;
    }
  }

  // Arranca directamente en Pantalla Cero
  render('p-cero');
</script>
</body>
</html>
